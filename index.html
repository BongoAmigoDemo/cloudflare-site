<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI News Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Press Start 2P', monospace;
      background: #0a0f1e;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      image-rendering: pixelated;
    }

    .studio {
      position: relative;
      width: 100%;
      max-width: 720px;
      aspect-ratio: 16 / 11;
      background: #1e293b url('/assets/background.png') center/cover no-repeat;
      border: 4px solid #334155;
      border-radius: 8px;
      overflow: hidden;
      image-rendering: pixelated;
    }

.anchors {
  position: absolute;
  bottom: 10%;
  left: 0;
  right: 0;
  display: flex;
  justify-content: center;
  gap: 3rem;
  z-index: 2;
}

.anchor {
  width: 30%;
  max-width: 180px;
  height: auto;
  image-rendering: pixelated;
  filter: drop-shadow(0 4px 0 rgba(0, 0, 0, 0.4));
}

    .anchor.talking {
      animation: bob 0.4s ease-in-out infinite alternate;
    }

    @keyframes bob {
      from { transform: translateY(0); }
      to { transform: translateY(-3px); }
    }

    .desk {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 19%;
      background: linear-gradient(180deg, #1e293b 0%, #0f172a 100%);
      border-top: 4px solid #334155;
      z-index: 3;
    }

    .breaking {
      position: absolute;
      top: 1rem;
      left: 1rem;
      background: #dc2626;
      color: #fff;
      padding: 0.4rem 0.8rem;
      font-size: 0.65rem;
      letter-spacing: 1px;
      border: 2px solid #7f1d1d;
      z-index: 5;
      display: none;
    }

    .breaking.active {
      display: block;
      animation: flash 0.8s steps(1) infinite;
    }

    @keyframes flash {
      0%, 50% { opacity: 1; }
      51%, 100% { opacity: 0.3; }
    }

    .bubble-wrap {
      position: absolute;
      bottom: 45%;
      left: 0;
      right: 0;
      display: flex;
      justify-content: center;
      padding: 0 1rem;
      z-index: 4;
    }

    .speech-bubble {
      position: relative;
      background: #f8fafc;
      color: #0f172a;
      padding: 1rem 1.25rem;
      border: 4px solid #0f172a;
      border-radius: 10px;
      font-size: 0.6rem;
      line-height: 1.8;
      max-width: 90%;
      min-height: 60px;
      box-shadow: 4px 4px 0 rgba(0, 0, 0, 0.4);
      image-rendering: pixelated;
    }

    /* Default (centered) tail */
.speech-bubble::after {
  content: '';
  position: absolute;
  bottom: -18px;
  left: 50%;
  transform: translateX(-50%);
  width: 0;
  height: 0;
  border-left: 12px solid transparent;
  border-right: 12px solid transparent;
  border-top: 18px solid #0f172a;
}
.speech-bubble::before {
  content: '';
  position: absolute;
  bottom: -12px;
  left: 50%;
  transform: translateX(-50%);
  width: 0;
  height: 0;
  border-left: 10px solid transparent;
  border-right: 10px solid transparent;
  border-top: 14px solid #f8fafc;
  z-index: 1;
}

/* Tail pointing left (anchor 1 talking) */
.bubble-wrap.speaking-left .speech-bubble::after { left: 25%; }
.bubble-wrap.speaking-left .speech-bubble::before { left: 25%; }

/* Tail pointing right (anchor 2 talking) */
.bubble-wrap.speaking-right .speech-bubble::after { left: 75%; }
.bubble-wrap.speaking-right .speech-bubble::before { left: 75%; }

    .speech-bubble::after,
.speech-bubble::before {
  transition: left 0.4s ease;
}

    .speech-bubble.pop {
      animation: popIn 0.35s ease-out;
    }

    @keyframes popIn {
      0% { transform: scale(0.85); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    .source-line {
      display: block;
      margin-top: 0.5rem;
      font-size: 0.5rem;
      color: #64748b;
    }

    .controls {
      margin-top: 1.5rem;
      display: flex;
      gap: 0.75rem;
    }

    .controls button {
      font-family: 'Press Start 2P', monospace;
      font-size: 0.55rem;
      padding: 0.6rem 1rem;
      background: #38bdf8;
      color: #0f172a;
      border: 3px solid #0284c7;
      border-radius: 4px;
      cursor: pointer;
      box-shadow: 3px 3px 0 rgba(0, 0, 0, 0.4);
    }

    .controls button:hover { background: #7dd3fc; }
    .controls button:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 rgba(0, 0, 0, 0.4); }

    footer {
      margin-top: 1.5rem;
      color: #475569;
      font-size: 0.5rem;
      text-align: center;
    }

    @media (max-width: 500px) {
      .speech-bubble { font-size: 0.5rem; line-height: 1.6; }
      .breaking { font-size: 0.55rem; }
    }
  </style>
</head>
<body>
  <div class="studio">
    <div class="breaking" id="breaking">BREAKING</div>

    <div class="bubble-wrap">

<div class="speech-bubble" id="bubble">
  <span id="dialogue">Loading tonight's headlines...</span>
  <div class="bubble-footer">
    <span class="source-line" id="sourceLine"></span>
    <a id="moreLink" class="more-link" href="#" target="news-reader" rel="noopener">Here's more news →</a>
  </div>
</div>

    <div class="anchors">
      <img src="/assets/anchor1.png" alt="Anchor 1" class="anchor" id="anchor1" />
      <img src="/assets/anchor2.png" alt="Anchor 2" class="anchor" id="anchor2" />
    </div>

    <div class="desk"></div>
  </div>

  <div class="controls">
    <button id="prevBtn">◀ PREV</button>
    <button id="pauseBtn">⏸ PAUSE</button>
    <button id="nextBtn">NEXT ▶</button>
  </div>

  <footer>
    <p>AI News Studio &copy; 2026</p>
  </footer>

  <script>
    let headlines = [];
    let currentIndex = 0;
    let paused = false;
    let cycleTimer = null;

    const bubble = document.getElementById('bubble');
    const dialogue = document.getElementById('dialogue');
    const sourceLine = document.getElementById('sourceLine');
    const breaking = document.getElementById('breaking');
    const anchor1 = document.getElementById('anchor1');
    const anchor2 = document.getElementById('anchor2');
    const pauseBtn = document.getElementById('pauseBtn');

    const CYCLE_MS = 9000;

    function sourceName(url) {
      if (!url) return '';
      try { return new URL(url).hostname.replace('www.', ''); }
      catch { return ''; }
    }

    function timeAgo(dateStr) {
      if (!dateStr) return '';
      const diff = Date.now() - new Date(dateStr).getTime();
      const hours = Math.floor(diff / 3600000);
      if (hours < 1) return 'just now';
      if (hours < 24) return `${hours}h ago`;
      return `${Math.floor(hours / 24)}d ago`;
    }

    function showStory(index) {
      if (headlines.length === 0) return;

      const item = headlines[(index + headlines.length) % headlines.length];
      const text = item.summary || item.description || item.title;

// Alternate which anchor is "talking"
const talkingAnchor = index % 2 === 0 ? anchor1 : anchor2;
const quietAnchor = index % 2 === 0 ? anchor2 : anchor1;
talkingAnchor.classList.add('talking');
quietAnchor.classList.remove('talking');

// Move the speech bubble tail to point at the speaker
const bubbleWrap = document.querySelector('.bubble-wrap');
bubbleWrap.classList.remove('speaking-left', 'speaking-right');
bubbleWrap.classList.add(index % 2 === 0 ? 'speaking-left' : 'speaking-right');
      

      // Trigger bubble pop animation
      bubble.classList.remove('pop');
      void bubble.offsetWidth;
      bubble.classList.add('pop');

      // Type out the dialogue character by character
      typeText(text, 18);

      sourceLine.textContent = `${sourceName(item.source)}  •  ${timeAgo(item.pubDate)}`;

      // Show "BREAKING" for stories under 2 hours old
      const ageHours = (Date.now() - new Date(item.pubDate).getTime()) / 3600000;
      if (ageHours < 2) {
        breaking.classList.add('active');
      } else {
        breaking.classList.remove('active');
      }
    }

    let typeTimer = null;
    function typeText(text, speedMs) {
      clearInterval(typeTimer);
      dialogue.textContent = '';
      let i = 0;
      typeTimer = setInterval(() => {
        dialogue.textContent += text[i];
        i++;
        if (i >= text.length) clearInterval(typeTimer);
      }, speedMs);
    }

    function nextStory() {
      currentIndex++;
      showStory(currentIndex);
    }

    function prevStory() {
      currentIndex--;
      showStory(currentIndex);
    }

    function startCycle() {
      clearInterval(cycleTimer);
      cycleTimer = setInterval(() => {
        if (!paused) nextStory();
      }, CYCLE_MS);
    }

    document.getElementById('nextBtn').addEventListener('click', () => {
      nextStory();
      startCycle();
    });

    document.getElementById('prevBtn').addEventListener('click', () => {
      prevStory();
      startCycle();
    });

    pauseBtn.addEventListener('click', () => {
      paused = !paused;
      pauseBtn.textContent = paused ? '▶ RESUME' : '⏸ PAUSE';
    });

    document.addEventListener('DOMContentLoaded', async () => {
      try {
        const res = await fetch('/api/news');
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        headlines = data.items || [];

        if (headlines.length === 0) {
          dialogue.textContent = 'No news tonight. Check back soon.';
          return;
        }

        showStory(0);
        startCycle();
      } catch (err) {
        console.error(err);
        dialogue.textContent = 'Signal lost. Unable to fetch the news.';
      }
    });
  </script>
</body>
</html>
