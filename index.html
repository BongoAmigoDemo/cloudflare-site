newsContainer.innerHTML = items.map(item => `
  <div class="news-item">
    <h3><a href="${item.link}" target="_blank" rel="noopener">${item.title}</a></h3>
    <p class="meta">
      <span class="source-tag">${sourceName(item.source || '')}</span>
      ${new Date(item.pubDate).toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' })}
    </p>
    ${item.summary ? `<p class="summary">${item.summary}</p>` : ''}
  </div>
`).join('');
