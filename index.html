<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI News Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Press Start 2P', monospace;
      background: #0a1428;
      color: #e8f4ff;
      min-height: 100vh;
      /* dvh keeps the layout correct under mobile browser chrome. The vh
         line above is the fallback for browsers without dvh support. */
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      /* Top-aligned: the stage and the speech panel now stack, so there is no
         single block to centre. */
      justify-content: flex-start;
      padding: 1rem;
      image-rendering: pixelated;
      /* Allow scrolling rather than centring content off the top of the
         viewport when the screen is too short (landscape phones). */
      overflow-y: auto;
    }

    .studio {
      position: relative;
      width: 100%;
      max-width: 720px;
      aspect-ratio: 16 / 11;
      /* Capped so the stage, speech panel, controls and footer all fit. */
      max-height: 52vh;
      max-height: 52dvh;
      background: #122440 url('/assets/background.png') center/cover no-repeat;
      border: 4px solid #244882;
      border-radius: 8px;
      overflow: hidden;
      image-rendering: pixelated;
      flex-shrink: 0;
    }

    .anchors {
      position: absolute;
      bottom: 10%;
      left: 0;
      right: 0;
      display: flex;
      justify-content: center;
      gap: 3rem;
      z-index: 2;
    }

    .anchor {
      width: 30%;
      max-width: 180px;
      height: auto;
      image-rendering: pixelated;
      filter: drop-shadow(0 4px 0 rgba(0, 0, 0, 0.4));
    }

    .anchor.talking {
      animation: bob 0.4s ease-in-out infinite alternate;
    }

    @keyframes bob {
      from { transform: translateY(0); }
      to { transform: translateY(-3px); }
    }

    .desk {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 19%;
      background: linear-gradient(180deg, #1a3460 0%, #0a1428 100%);
      border-top: 4px solid #244882;
      z-index: 3;
    }

    .breaking {
      position: absolute;
      top: 1rem;
      left: 1rem;
      background: #a00028;
      color: #fff;
      padding: 0.4rem 0.8rem;
      font-size: 0.65rem;
      letter-spacing: 1px;
      border: 2px solid #600018;
      z-index: 5;
      display: none;
    }

    .breaking.active {
      display: block;
      animation: flash 0.8s steps(1) infinite;
    }

    @keyframes flash {
      0%, 50% { opacity: 1; }
      51%, 100% { opacity: 0.3; }
    }

    /* The speech bubble used to sit inside the studio, absolutely positioned.
       That forced it to compete with the anchors for a fixed-aspect frame,
       which squeezed the dialogue down to 6.4px on phones. It now lives in its
       own panel directly below the stage, so the text has room to be legible
       and the presenters are no longer covered. The top edge tucks up under
       the studio border to keep the two reading as one unit. */
    .bubble-wrap {
      position: static;
      width: 100%;
      max-width: 720px;
      margin-top: -16px;
      display: flex;
      justify-content: center;
      padding: 0 0.75rem;
      z-index: 6;
    }

    .speech-bubble {
      position: relative;
      background: #e8f4ff;
      color: #0a1428;
      padding: 0.9rem 1rem;
      border: 4px solid #0a1428;
      border-radius: 10px;
      /* Readable at this size; the overlay layout could only afford 0.4rem. */
      font-size: 0.8rem;
      line-height: 1.55;
      max-width: 100%;
      min-height: 0;
      box-shadow: 4px 6px 0 rgba(0, 0, 0, 0.4);
      image-rendering: pixelated;
    }

    /* Tail now points up at the stage instead of down at the anchors. */
    .speech-bubble::after {
      content: '';
      position: absolute;
      top: -19px;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 13px solid transparent;
      border-right: 13px solid transparent;
      border-bottom: 19px solid #0a1428;
      transition: left 0.4s ease;
    }
    .speech-bubble::before {
      content: '';
      position: absolute;
      top: -13px;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 10px solid transparent;
      border-right: 10px solid transparent;
      border-bottom: 14px solid #e8f4ff;
      z-index: 1;
      transition: left 0.4s ease;
    }

    /* Tail tracks whichever anchor is speaking. The panel is wider than the
       stage art, so the offsets sit further in than they did when the bubble
       was constrained inside the frame. */
    .bubble-wrap.speaking-left .speech-bubble::after { left: 32%; }
    .bubble-wrap.speaking-left .speech-bubble::before { left: 32%; }

    /* Tail points right when anchor 2 talks */
    .bubble-wrap.speaking-right .speech-bubble::after { left: 68%; }
    .bubble-wrap.speaking-right .speech-bubble::before { left: 68%; }

    .speech-bubble.pop {
      animation: popIn 0.35s ease-out;
    }

    @keyframes popIn {
      0% { transform: scale(0.85); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    .bubble-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      margin-top: 0.75rem;
      padding-top: 0.5rem;
      border-top: 1px solid #3f7ac4;
    }

    .source-line {
      font-size: 0.65rem;
      color: #244882;
    }

.more-link {
  color: #3060a4;
  text-decoration: none;
  font-size: 0.65rem;
  white-space: nowrap;
  border-bottom: 2px solid transparent;
  cursor: pointer;
  opacity: 0;
  transition: opacity 0.4s ease;
}

.more-link.visible {
  opacity: 1;
}

.more-link:hover {
  border-bottom-color: #3060a4;
}

    .controls {
      margin-top: 1.5rem;
      display: flex;
      gap: 0.75rem;
      margin-bottom: auto;
    }

    .controls button {
      font-family: 'Press Start 2P', monospace;
      font-size: 0.55rem;
      padding: 0.6rem 1rem;
      background: #5596dc;
      color: #0a1428;
      border: 3px solid #3f7ac4;
      border-radius: 4px;
      cursor: pointer;
      box-shadow: 3px 3px 0 rgba(0, 0, 0, 0.4);
    }

    .controls button:hover { background: #74b0ea; }
    .controls button:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 rgba(0, 0, 0, 0.4); }

    footer {
      margin-top: 1.5rem;
      color: #3060a4;
      font-size: 0.5rem;
      text-align: center;
    }

    /* --- Wider screens ---
       The anchors' hair grazed the bottom of the bubble here (about 3px at
       1280x800). Nudging the sprites down clears it without moving them
       noticeably, since the sprite art starts 10px into the 128px canvas. */
    @media (min-width: 701px) and (min-height: 561px) {
      .anchors { bottom: 6%; }
    }

    /* Touch devices have no hover, so never hide the story link behind one. */
    @media (hover: none) {
      .more-link { opacity: 1; }
    }

    /* --- Phones --- */
    @media (max-width: 700px) {
      body { padding: 0.75rem; }

      /* 4/3 matches the background art. Capped so the stage, the speech panel,
         the controls and the footer all fit without the page scrolling. */
      .studio {
        aspect-ratio: 4 / 3;
        max-height: 52vh;
        max-height: 52dvh;
      }

      /* A shorter desk shows more of the presenters. At 19% the desk covered
         the sprites from the shoulders down, leaving roughly 30px of a 79px
         sprite visible -- just the heads. */
      .desk { height: 12%; }

      .bubble-wrap {
        margin-top: -12px;
        padding: 0 0.5rem;
      }

      .speech-bubble {
        font-size: 0.75rem;
        line-height: 1.5;
        padding: 0.75rem 0.8rem;
        border-width: 3px;
        box-shadow: 3px 4px 0 rgba(0, 0, 0, 0.4);
      }

      /* Smaller upward tail, matching the thinner border. */
      .speech-bubble::after {
        top: -14px;
        border-left-width: 10px;
        border-right-width: 10px;
        border-bottom: 14px solid #0a1428;
      }
      .speech-bubble::before {
        top: -9px;
        border-left-width: 8px;
        border-right-width: 8px;
        border-bottom-width: 11px;
      }

      .bubble-footer {
        gap: 0.3rem;
        margin-top: 0.5rem;
        padding-top: 0.4rem;
        flex-wrap: wrap;
      }

      .source-line,
      .source-line,
      .more-link { font-size: 0.6rem; }

      /* Nothing overlays the presenters now, so the sprites can be larger and
         sit lower in the frame instead of being kept clear of the bubble. */
      .anchor { width: 30%; }
      .anchors { gap: 1.5rem; bottom: 4%; }

      .controls {
        margin-top: 1rem;
        gap: 0.5rem;
      }

      .controls button {
        font-size: 0.5rem;
        padding: 0.7rem 0.8rem;
      }

      footer {
        margin-top: 0.75rem;
        font-size: 0.45rem;
      }
    }

    /* Very narrow phones (iPhone SE and similar). */
    @media (max-width: 380px) {
      .controls button { padding: 0.65rem 0.55rem; font-size: 0.45rem; }
      /* landscape guards against this unless a pixel width is set later */
    }

    /* --- Short viewports: landscape phones ---
       Kept last so it wins the cascade over the narrow-phone rule above: a
       740px-wide landscape phone is wider than 700px. The stage is capped
       tightly here because the speech panel, controls and footer all have to
       share the same short viewport. */
    @media (max-height: 560px) and (orientation: landscape) {
      body {
        justify-content: flex-start;
        padding: 0.5rem;
      }

      .studio {
        aspect-ratio: 16 / 9;
        max-height: 46vh;
        max-height: 46dvh;
      }

      .desk { height: 12%; }

      .bubble-wrap {
        margin-top: -10px;
        padding: 0 0.5rem;
      }

      .speech-bubble {
        font-size: 0.7rem;
        line-height: 1.45;
        padding: 0.6rem 0.7rem;
      }

      .bubble-footer {
        margin-top: 0.4rem;
        padding-top: 0.3rem;
        gap: 0.3rem;
      }

      .source-line,
      .more-link { font-size: 0.55rem; }

      .anchor { width: 26%; }
      .anchors { gap: 1rem; bottom: 2%; }

      .controls {
        margin-top: 0.35rem;
        margin-bottom: 0;
      }

      .controls button {
        font-size: 0.45rem;
        padding: 0.5rem 0.7rem;
      }

      footer {
        margin-top: 0.25rem;
        font-size: 0.4rem;
      }
    }
  </style>
</head>
<body>
  <div class="studio">
    <div class="breaking" id="breaking">BREAKING</div>

    <div class="anchors">
      <img src="/assets/anchor1.png" alt="Anchor 1" class="anchor" id="anchor1" />
      <img src="/assets/anchor2.png" alt="Anchor 2" class="anchor" id="anchor2" />
    </div>

    <div class="desk"></div>
  </div>

  <!-- The speech panel sits below the stage rather than inside it. Overlaying
       the frame forced the dialogue down to 6.4px on phones; out here it can be
       read, and the presenters are never covered. -->
  <div class="bubble-wrap">
    <div class="speech-bubble" id="bubble">
      <span id="dialogue">Loading tonight's headlines...</span>
      <div class="bubble-footer">
        <span class="source-line" id="sourceLine"></span>
        <a id="moreLink" class="more-link" href="#" target="news-reader">Read the story →</a>
      </div>
    </div>
  </div>

  <div class="controls">
    <button id="prevBtn">◀ PREV</button>
    <button id="pauseBtn">⏸ PAUSE</button>
    <button id="nextBtn">NEXT ▶</button>
  </div>

  <footer>
    <p>AI News Studio &copy; 2026</p>
  </footer>

  <script>
    let headlines = [];
    let currentIndex = 0;
    let paused = false;
    let cycleTimer = null;
    let typeTimer = null;

    const bubble = document.getElementById('bubble');
    const dialogue = document.getElementById('dialogue');
    const sourceLine = document.getElementById('sourceLine');
    const moreLink = document.getElementById('moreLink');
    const breaking = document.getElementById('breaking');
    const anchor1 = document.getElementById('anchor1');
    const anchor2 = document.getElementById('anchor2');
    const pauseBtn = document.getElementById('pauseBtn');
    const bubbleWrap = document.querySelector('.bubble-wrap');

    // Pacing. A story now stays on screen for as long as its line takes to
    // type, plus a fixed dwell, instead of a fixed 11s slot that could cut the
    // dialogue off mid-sentence.
    const TYPE_MS = 18;    // per character
    const DWELL_MS = 4500; // how long the finished line is held

    function sourceName(url) {
      if (!url) return '';
      try { return new URL(url).hostname.replace('www.', ''); }
      catch { return ''; }
    }

    // pubDate arrives as epoch milliseconds, either as a number or as a string
    // that D1 may render with a trailing ".0", or as an RFC-822 date string for
    // legacy rows. new Date('1791210909000') is Invalid Date, which rendered as
    // "NaNd ago", so the numeric form is detected before Date parsing.
    function parseDate(value) {
      if (value === null || value === undefined || value === '') return NaN;
      if (typeof value === 'number') return value;
      const text = String(value).trim();
      if (/^\d+(\.\d+)?$/.test(text)) return Number(text);
      return new Date(text).getTime();
    }

    function timeAgo(pubDate) {
      const t = parseDate(pubDate);
      if (Number.isNaN(t)) return '';
      const diff = Date.now() - t;
      const hours = Math.floor(diff / 3600000);
      if (hours < 1) return 'just now';
      if (hours < 24) return `${hours}h ago`;
      return `${Math.floor(hours / 24)}d ago`;
    }

    function showStory(index) {
      if (headlines.length === 0) return;

      const item = headlines[(index + headlines.length) % headlines.length];
      const text = item.summary || item.description || item.title;

      // Alternate which anchor is "talking"
      const talkingAnchor = index % 2 === 0 ? anchor1 : anchor2;
      const quietAnchor = index % 2 === 0 ? anchor2 : anchor1;
      talkingAnchor.classList.add('talking');
      quietAnchor.classList.remove('talking');

      // Move the speech bubble tail to point at the speaker
      bubbleWrap.classList.remove('speaking-left', 'speaking-right');
      bubbleWrap.classList.add(index % 2 === 0 ? 'speaking-left' : 'speaking-right');

      // Trigger bubble pop animation
      bubble.classList.remove('pop');
      void bubble.offsetWidth;
      bubble.classList.add('pop');

      sourceLine.textContent = `${sourceName(item.source)}  •  ${timeAgo(item.pubDate)}`;

      // Hide the link at the start of each story
      moreLink.classList.remove('visible');
      moreLink.href = item.link || '#';
      moreLink.textContent = "Read the story →";

      // Type out the dialogue, then reveal the link and schedule the next
      // story. Advancing from here rather than from a fixed wall-clock
      // interval means a story is never swapped out mid-sentence.
      typeText(text, TYPE_MS, () => {
        moreLink.classList.add('visible');
        scheduleNext(text);
      });

      // Show "BREAKING" for stories under 2 hours old. Only when the date is
      // actually parseable, so a bad value cannot claim to be breaking news.
      const publishedAt = parseDate(item.pubDate);
      const ageHours = (Date.now() - publishedAt) / 3600000;
      if (!Number.isNaN(publishedAt) && ageHours < 2) {
        breaking.classList.add('active');
      } else {
        breaking.classList.remove('active');
      }
    }

function typeText(text, speedMs, onComplete) {
  clearInterval(typeTimer);
  dialogue.textContent = '';
  let i = 0;
  typeTimer = setInterval(() => {
    dialogue.textContent += text[i];
    i++;
    if (i >= text.length) {
      clearInterval(typeTimer);
      if (onComplete) onComplete();
    }
  }, speedMs);
}

    function nextStory() {
      currentIndex++;
      showStory(currentIndex);
    }

    function prevStory() {
      currentIndex--;
      showStory(currentIndex);
    }

    // How long a line may stay on screen. The parameter is the text currently
    // being typed, not the story about to be shown.
    function scheduleNext(typedText) {
      clearTimeout(cycleTimer);
      if (paused) return;
      const typingMs = (typedText ? typedText.length : 0) * TYPE_MS;
      cycleTimer = setTimeout(() => {
        if (paused) return;
        nextStory();
      }, typingMs + DWELL_MS);
    }

    document.getElementById('nextBtn').addEventListener('click', () => {
      nextStory();
    });

    document.getElementById('prevBtn').addEventListener('click', () => {
      prevStory();
    });

    pauseBtn.addEventListener('click', () => {
      paused = !paused;
      pauseBtn.textContent = paused ? '▶ RESUME' : '⏸ PAUSE';
      if (paused) {
        clearTimeout(cycleTimer);
      } else {
        scheduleNext(dialogue.textContent);
      }
    });

    document.addEventListener('DOMContentLoaded', async () => {
      try {
        const res = await fetch('/api/news');
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        headlines = data.items || [];

        if (headlines.length === 0) {
          dialogue.textContent = 'No news tonight. Check back soon.';
          return;
        }

        // showStory types the line and schedules the next story itself.
        showStory(0);
      } catch (err) {
        console.error(err);
        dialogue.textContent = 'Signal lost. Unable to fetch the news.';
      }
    });
  </script>
</body>
</html>
