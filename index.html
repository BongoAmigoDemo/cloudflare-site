<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Latest AI News</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: linear-gradient(135deg, #0f172a, #1e293b);
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem;
    }
    header { text-align: center; margin-bottom: 2rem; }
    h1 { font-size: 2.2rem; margin-bottom: 0.5rem; }
    .highlight {
      background: linear-gradient(90deg, #38bdf8, #a78bfa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .subtitle { color: #94a3b8; }
    main { max-width: 700px; width: 100%; }
    .card {
      background: rgba(30, 41, 59, 0.8);
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 1.5rem;
    }
    .news-item { margin-bottom: 1.25rem; padding-bottom: 1.25rem; border-bottom: 1px solid #1e293b; }
    .news-item:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
    .news-item h3 { margin-bottom: 0.35rem; font-size: 1rem; line-height: 1.4; }
    .news-item a { color: #38bdf8; text-decoration: none; }
    .news-item a:hover { text-decoration: underline; }
    .news-item .meta { color: #64748b; font-size: 0.8rem; }
    .source-tag {
      display: inline-block;
      background: #1e293b;
      color: #94a3b8;
      padding: 0.1rem 0.5rem;
      border-radius: 4px;
      font-size: 0.7rem;
      margin-right: 0.5rem;
    }
    footer { margin-top: 3rem; color: #64748b; font-size: 0.85rem; }
    .loading { color: #94a3b8; }
  </style>
</head>
<body>
  <header>
    <h1>Latest <span class="highlight">AI News</span></h1>
    <p class="subtitle">Fresh headlines from around the web</p>
  </header>

  <main>
    <section class="card">
      <div id="news-list" class="loading">Loading news...</div>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 AI News. Built with AI.</p>
  </footer>

  <script>
    async function loadAiNews() {
      const newsContainer = document.getElementById('news-list');
      if (!newsContainer) return;

      try {
        const response = await fetch('/api/news');
        if (!response.ok) throw new Error(`Server returned ${response.status}`);

        const data = await response.json();
        const items = data.items || [];

        if (items.length === 0) {
          newsContainer.innerHTML = '<p>No news found.</p>';
          return;
        }

        const sourceName = (url) => {
          try { return new URL(url).hostname.replace('www.', ''); }
          catch { return 'unknown'; }
        };

        newsContainer.innerHTML = items.map(item => `
          <div class="news-item">
            <h3><a href="${item.link}" target="_blank" rel="noopener">${item.title}</a></h3>
            <p class="meta">
              <span class="source-tag">${sourceName(item.source || '')}</span>
              ${new Date(item.pubDate).toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' })}
            </p>
          </div>
        `).join('');

      } catch (error) {
        console.error('Error loading news:', error);
        newsContainer.innerHTML = '<p>Could not load news at this time.</p>';
      }
    }

    document.addEventListener('DOMContentLoaded', loadAiNews);
  </script>
</body>
</html>
